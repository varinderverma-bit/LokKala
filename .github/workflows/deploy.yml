# Deployment pipeline with integration tests for Art Marketplace
# - Lint, typecheck, unit tests → build frontend → build CDK → deploy (staging) → integration tests

name: Deploy and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install and build
        run: npm ci && npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

  build-cdk:
    name: Build & Synth CDK
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Build CDK
        working-directory: infrastructure
        run: npm run build

      - name: CDK Synth
        working-directory: infrastructure
        run: npx cdk synth --no-staging
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID || '000000000000' }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-frontend, build-cdk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository != ''
    environment: staging
    outputs:
      api_url: ${{ steps.outputs.api_url }}
      app_url: ${{ steps.outputs.app_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Install root dependencies
        run: npm ci

      - name: Install infrastructure dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Build CDK
        working-directory: infrastructure
        run: npm run build

      - name: Deploy CDK stack
        working-directory: infrastructure
        run: npx cdk deploy --require-approval never --outputs-file cdk-outputs.json
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set deployment outputs
        id: outputs
        working-directory: infrastructure
        run: |
          API_URL=$(node -e "try { const o=require('./cdk-outputs.json'); const k=Object.keys(o)[0]; console.log((o[k]&&o[k].ArtMarketplaceApiUrl)||''); } catch(e) { console.log(''); }")
          APP_URL=$(node -e "try { const o=require('./cdk-outputs.json'); const k=Object.keys(o)[0]; console.log((o[k]&&o[k].ArtMarketplaceAppUrl)||''); } catch(e) { console.log(''); }")
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

  integration-tests:
    name: Integration Tests (E2E API)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          E2E_API_BASE_URL: ${{ needs.deploy.outputs.api_url }}

  integration-tests-with-url:
    name: Integration Tests (with E2E_API_BASE_URL)
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    if: github.event_name == 'workflow_dispatch' && vars.E2E_API_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
